name: Keep Render Alive

on:
  schedule:
    - cron: '*/10 * * * *' 
  workflow_dispatch:  
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: |
          echo "Pinging at $(date)"
          response=$(curl -s -o /dev/null -w "%{http_code}" https://food-recommender-scq5.onrender.com/health)
          echo "Response: $response"
          if [ $response -eq 200 ]; then
            echo "...Service is alive"
          else
            echo "...Service returned $response"
          fi